# Tarea diaria: descarga precios y reportes, recalcula los ratios y sube los cambios de data/produccion/ (lista de archivos: docs/entrega_2/11_producto.md, sección 6).
#
# - Render (API) y Streamlit Community Cloud (dashboard) se redespliegan solos por el webhook de push de GitHub
#   cuando llega el commit de datos a la rama que cada uno vigila (no por Actions).
# - GitHub solo ejecuta los `schedule` desde la RAMA POR DEFECTO del repositorio. El workflow hace checkout de la rama
#   que lo dispara y hace commit y push a esa misma rama; con `workflow_dispatch` corre en la rama que se elija.
#   Para que el cron diario funcione, este archivo debe estar en la rama por defecto.
# - El commit hecho con GITHUB_TOKEN no dispara otros workflows (no hay otros).
# - Los repositorios públicos sin actividad en 60 días desactivan los `schedule` (sin impacto antes del 29 de noviembre).
# - Si la descarga falla, el paso "Commit" se omite (el dashboard sigue mostrando el último dato bueno) y el
#   keep-alive corre igual, para que Supabase no se pause.
name: Actualizar datos

on:
  schedule:
    - cron: "30 22 * * 1-5"      # 22:30 UTC, de lunes a viernes: 1,5 h o más después del cierre de EE.UU.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependencias
        run: uv sync --group app
      - name: Descargar y recalcular
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: uv run python scripts/actualizar_datos.py
      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/produccion
          git diff --cached --quiet || (git commit -m "datos: actualización diaria $(date -u +%F)" && git pull --rebase && git push)
      - name: Keep-alive
        if: always()
        env:
          API_URL: ${{ secrets.API_URL }}
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors "$API_URL/estado"
